(async()=>{
const bytes=Uint8Array.from(atob(document.getElementById('data').textContent.trim()),c=>c.charCodeAt(0));
const D=JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
const $=id=>document.getElementById(id),N='http://www.w3.org/2000/svg',money=x=>x==null?'—':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(x),sign=x=>x<0?'−':x>0?'+':'',f=(x,n=1)=>x==null?'—':sign(x)+Math.abs(x).toFixed(n),pct=(x,n=1)=>x==null?'—':f(x,Math.abs(x)>99.9&&Math.abs(x)<100?2:n)+'%',tone=x=>x<0?'negative':x>0?'positive':'',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const time=x=>new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Tirane',hour:'2-digit',minute:'2-digit'}).format(new Date(x));
const date=x=>new Date(x).toISOString().slice(0,10);
function stat(label,value,note='',cl=''){return `<div><small>${label}</small><b class="${cl}">${value}</b><small>${note}</small></div>`}
function cell(r){return `<div class="cell"><b>${r.winPct==null?'—':r.winPct.toFixed(1)+'%'} <small>${r.wins}/${r.n}</small></b><span class="${tone(r.returnPct)}">${pct(r.returnPct)}</span><small>DD ${r.maxDrawdownPct.toFixed(1)} / worst ${r.worstTradePct==null?'—':r.worstTradePct.toFixed(1)}%</small><small>${r.targetHits}/${r.stops}/${r.deadlineExits}/${r.rejected}</small></div>`}
const WINDOW_LABEL={full:'09:30–16:00 NY',central:'10:30–15:30 NY'};
const PROFITS=D.takeProfitTargets,studyCache=new Map();
const profitLabel=p=>p?`+${p}%`:'08:27';
function study(inst,window,gap=0,profit=0){
 const key=inst.epic+'/'+window+'/'+gap+'/'+profit;if(studyCache.has(key))return studyCache.get(key);
 let result;
 if(profit)result={runs:inst.exitStudy.runs.filter(r=>r.sessionWindow===window&&r.minimumGapBp===gap&&r.profitPct===profit),curves:inst.exitStudy.curves[window+'/'+gap+'/'+profit]};
 else if(gap===0)result=window==='full'?{runs:inst.runs,curves:inst.curves,trades:D.trades[inst.epic]}:inst.central;
 else{const x=inst.gapStudy.sessions[window];result={runs:x.runs.filter(r=>r.minimumGapBp===gap),curves:x.curves[String(gap)],trades:x.trades[String(gap)]}}
 studyCache.set(key,result);return result;
}
function risk(inst,window,policy,gap=0,profile='L20S20',profit=0){return study(inst,window,gap,profit).runs.find(r=>r.policy===policy&&r.profile===profile)}
function policyName(p){return p.id==='steps16'?'Agreeing steps ≥61.5% (16/26 full · 13/20 central)':p.label}
function studyControls(){return `<section id="dimensions"><h2>Session window × overnight counter-move × profit exit</h2><div class="risk-pair"><div><b>Full · 09:30–16:00 NY</b><p class="muted">390 min · 26 quarter-hours · ≥351 observed minutes · baseline≥13/26 steps, strict ≥16/26</p></div><div><b>Central · 10:30–15:30 NY</b><p class="muted">300 min · 20 quarter-hours · ≥270 observed minutes · baseline≥10/20 steps, strict ≥13/20; first hour and last half-hour ignored</p></div></div><p class="research-note">Bullish day + 03:27 bid below the 22:00 bid → buy. Bearish day + bid above the reference → sell. Equal/same-side prices skip. Gap minimums: any positive move, 5 bp (0.05%), 15 bp (0.15%), 30 bp (0.30%). Distances use the reference bid; actual fills include spread/latency. Central-session move,range, body, efficiency and reversal use only 10:30–15:30 bars; agreement fractions stay fixed and integer counts round up.</p><p>Close at +20%, +50%, +100% of that trade’s starting capital, or keep only the 08:27 deadline. Loss stops apply to every choice; the first reached exit wins. Targets use executable bid/ask prices after the opening spread. A target is not a guaranteed realized return.</p></section>`}
function exitFocus(){return `<section id="profit-exits"><h2>What closes the trade · original 1:200 /50% loss budget</h2><p class="muted">Current day definition, any positive gap. Green: profit target; red: loss stop; gray: deadline. Returns include execution costs. High-leverage reference, not the selected cohort's risk setting.</p><div class="risk-pair">${D.instruments.map(inst=>`<div><h3>${inst.epic}</h3>${['full','central'].map(w=>`<h4>${WINDOW_LABEL[w]}</h4>${PROFITS.map(t=>{const r=risk(inst,w,'current',0,'L200S50',t),n=r.n||1;return `<div class="exit-mix-row" data-exit-mix="${inst.epic}/${w}/${t}"><b>${profitLabel(t)}</b><div class="exit-mix"><span style="width:${100*r.targetHits/n}%;background:var(--success)"></span><span style="width:${100*r.stops/n}%;background:var(--destructive)"></span><span style="width:${100*r.deadlineExits/n}%;background:var(--muted-foreground)"></span><span style="width:${100*r.otherExits/n}%;background:var(--chart-3)"></span></div><span class="exit-impact"><b class="${tone(r.returnPct)}">${pct(r.returnPct)}</b><b class="${r.maxDrawdownPct>40?'negative':'muted'}">DD ${r.maxDrawdownPct.toFixed(1)}%</b></span><small>${r.targetHits} TP · ${r.stops} loss · ${r.deadlineExits} time · ${r.n} trades · ${r.winPct==null?'—':r.winPct.toFixed(1)+'%'} wins</small></div>`}).join('')}`).join('')}</div>`).join('')}</div></section>`}
function studyOverview(){const c=D.events;return `<section id="studyOverview"><h2>Day filter × NY window × gap × profit exit</h2><div class="risk-pair">${D.instruments.map(inst=>`<div><h3>${inst.epic}</h3>${inst.spec.policies.map(p=>gapSummary(inst,p)).join('')}</div>`).join('')}</div><p class="research-note">Rare context: ${c.taggedSessionCount}/${c.sessionCount} observed NY sessions (${(100*c.taggedSessionShare).toFixed(1)}%) have a curated major label. Central-bank decision dates remain excluded by the existing calendar guards. Labels are historical context,not an added trade filter.</p></section>`}
function gapSummary(inst,p){return `<h4>${esc(policyName(p))} · 1:20 /20% loss target</h4>${['full','central'].map(w=>`<h5>${WINDOW_LABEL[w]}</h5><table class="gap-summary"><thead><tr><th>Profit exit</th>${D.gapThresholds.map(g=>`<th>${g===0?'Any gap':'≥'+g+' bp'}</th>`).join('')}</tr></thead><tbody>${PROFITS.map(t=>`<tr><th>${profitLabel(t)}</th>${D.gapThresholds.map(g=>{const r=risk(inst,w,p.id,g,'L20S20',t);return `<td><b class="${tone(r.returnPct)}">${pct(r.returnPct)}</b><br><small>${r.wins}/${r.n} wins · ${r.tradesPerYear.toFixed(1)}/yr</small><br><small>DD ${r.maxDrawdownPct.toFixed(1)}%</small><br><small>${r.targetHits} TP · ${r.deadlineExits} time</small></td>`}).join('')}</tr>`).join('')}</tbody></table>`).join('')}`}

function riskTable(inst,p,window,gap){return `<div><h4>${WINDOW_LABEL[window]}</h4><table class="matrix"><thead><tr><th>Tier</th><th class="profit-column">Profit</th>${inst.spec.stops.map(x=>`<th>−${x}%</th>`).join('')}</tr></thead><tbody>${inst.spec.leverageTiers.map(l=>PROFITS.map((t,i)=>`<tr class="${i===0?'tier-start':''}">${i===0?`<th rowspan="4">1:${l}</th>`:''}<th class="profit-column">${profitLabel(t)}</th>${inst.spec.stops.map(v=>`<td>${cell(risk(inst,window,p.id,gap,`L${l}S${v}`,t))}</td>`).join('')}</tr>`).join('')).join('')}</tbody></table></div>`}

function yearsTable(inst,p,gap){return `<table><thead><tr><th>1:20 /20% · window /profit</th><th>2024</th><th>2025</th><th>2026 Jan–Sep</th></tr></thead><tbody>${['full','central'].flatMap(w=>PROFITS.map(t=>{const r=risk(inst,w,p.id,gap,'L20S20',t);return `<tr><td>${w==='full'?'Full':'Central'} · ${profitLabel(t)}</td>${['2024','2025','2026'].map(y=>{const z=r.years[y];return `<td><span class="${tone(z.returnPct)}">${z.n?pct(z.returnPct):'—'}</span><br><small>${z.wins}/${z.n} wins</small></td>`}).join('')}</tr>`})).join('')}</tbody></table>`}

function payoffTable(inst,p,gap){return `<div class="scroll"><table><thead><tr><th>1:20 /20% · window /profit</th><th>Mean win</th><th>Mean loss</th><th>Mean/trade</th><th>Win% for zero P&amp;L</th><th>Spread drag</th><th>TP /loss /time</th></tr></thead><tbody>${['full','central'].flatMap(w=>PROFITS.map(t=>{const r=risk(inst,w,p.id,gap,'L20S20',t);return `<tr><td>${w==='full'?'Full':'Central'} · ${profitLabel(t)}</td><td>${pct(r.avgWinPct)}</td><td>${pct(r.avgLossPct)}</td><td class="${tone(r.meanPct)}">${pct(r.meanPct,2)}</td><td>${r.breakEvenWinPct==null?'—':r.breakEvenWinPct.toFixed(1)+'%'}</td><td>${r.meanSpreadPct==null?'—':r.meanSpreadPct.toFixed(2)+'%'}</td><td>${r.targetHits}/${r.stops}/${r.deadlineExits}</td></tr>`})).join('')}</tbody></table></div>`}

function matrix(inst,p,gap){return `<section class="gap-panel" data-gap="${gap}"><h4>${gap===0?'Any positive gap':`Minimum ${gap} bp · ${(gap/100).toFixed(2)}%`}</h4>${payoffTable(inst,p,gap)}<div class="risk-pair">${riskTable(inst,p,'full',gap)}${riskTable(inst,p,'central',gap)}</div>${yearsTable(inst,p,gap)}</section>`}
function policyView(inst,p){return `<article class="policy"><h3>${inst.epic} · ${esc(policyName(p))}</h3>${PROFITS.map(t=>`<section class="exit-figures" data-profit="${t}"><h4>${t?'Close at +'+t+'% of entry capital or 08:27':'Deadline-only exit · 08:27'}</h4><div class="gap-charts">${D.gapThresholds.map(g=>`<div><h5>${g===0?'Any positive gap':`≥${g} bp · ${(g/100).toFixed(2)}%`}</h5><div id="curve-${inst.epic}-${p.id}-${g}-${t}" class="plot" aria-label="Full and central recognition, ${t}% profit target, ${g}bp gap"></div></div>`).join('')}</div></section>`).join('')}<div class="legend"><span><i class="key" style="background:var(--chart-1)"></i>Full session</span><span><i class="key" style="background:var(--chart-2)"></i>Central session</span><span>Same axes · 1:20 /20% loss target</span><span>Dashed: ${inst.epic} hold (${pct(D.benchmarks[inst.epic].returnPct)})</span></div><div class="all-gaps">${D.gapThresholds.map(g=>matrix(inst,p,g)).join('')}</div></article>`}

function eventBadge(events){return !events?.length?'—':events.map(e=>`<a class="major-event" href="${esc(e.sources[0].url)}" title="${esc(e.sources[0].title)}">${esc(e.label)}</a><small>${esc(e.timing)} · ${e.knownAtEntry===true?'known before entry':e.knownAtEntry===false?'after entry':'date-level/retrospective'}</small>`).join('<br>')}
function ledger(inst,window){const rows=study(inst,window).trades;return `<section class="data-section"><h3>${inst.epic} · ${WINDOW_LABEL[window]} recognition · baseline-rule trades · any positive gap · 1:200 /50%</h3><p class="muted">Colored path is the recognition window. Gray edges are ignored in the central version. Largest reversal uses minute highs/lows; the sparkline shows quarter-hour closes. Price feature percentages start at the recognition-window open.</p><div class="scroll"><table class="ledger"><thead><tr><th>Entry · Albania</th><th>Side</th><th>Prior NY path</th><th>Major prior-day context</th><th>Return</th><th>Open→close</th><th>Close reason</th><th>Signal gap</th><th>Gap membership (bp)</th><th>Fill gap</th><th>Spread drag</th><th>Funding</th><th>Units</th><th>Entry capital</th><th>Day move</th><th>Efficiency</th><th>Agree</th><th>Reversal</th><th>Body/range</th></tr></thead><tbody>${rows.map(t=>`<tr><td>${t.date}<br><small>03:27 · prior${t.session}</small></td><td>${t.side}<br><small>${t.side==='long'?'Bullish+dip':'Bearish+bounce'}</small></td><td><svg class="spark" data-epic="${inst.epic}" data-window="${window}" data-trade="${t.id}"></svg></td><td class="event-cell">${eventBadge(t.events)}</td><td class="${tone(t.returnPct)}">${pct(t.returnPct)}</td><td>${t.entryPrice.toFixed(1)}→${t.exitPrice.toFixed(1)}</td><td>${time(t.exitTime)} · ${t.exitReason==='stop_loss'?'loss stop':t.exitReason==='session_end'?'deadline':esc(t.exitReason)}</td><td>${t.pullbackBp.toFixed(1)}bp</td><td>${D.gapThresholds.map(g=>`${g===0?'>0':g} ${t.pullbackBp>=g?'✓':'−'}`).join(' · ')}</td><td>${t.fillCounterMoveBp==null?'—':f(t.fillCounterMoveBp)+'bp'}</td><td>${t.spreadCostPct.toFixed(2)}%</td><td>${money(t.funding)}</td><td>${t.size.toFixed(2)}</td><td>${money(t.entryEquity)}</td><td>${t.movePct.toFixed(2)}%</td><td>${(t.efficiency*100).toFixed(1)}%</td><td>${t.agreementSteps}/${t.intervals}</td><td>${(t.retracement*100).toFixed(1)}%</td><td>${(t.body*100).toFixed(1)}%</td></tr>`).join('')}</tbody></table></div></section>`}
function compareValues(a,b){return `<span class="comparison-values"><span>${a}</span><small>→</small><span>${b}</span></span>`}
function instrumentInner(inst){const selectedGap=0;const checks=inst.centralQuoteChecks,checkNote=selectedGap===0?`<p class="research-note">Deadline-only central baseline1:20/20%,four generated quote-path checks: ${Math.min(...checks.map(c=>c.winPct)).toFixed(1)}–${Math.max(...checks.map(c=>c.winPct)).toFixed(1)}% wins; ${pct(Math.min(...checks.map(c=>c.returnPct)))} to ${pct(Math.max(...checks.map(c=>c.returnPct)))} total return. Synthetic-path sensitivity is not independent forward validation.</p>`:'';const full=risk(inst,'full','current'),central=risk(inst,'central','current'),change=inst.classificationChanges.current;return `<h2>${inst.epic} · all gaps, profit exits, leverage tiers and loss targets</h2><div class="stats">${stat('Baseline fills · full→central',compareValues(full.n,central.n),'Minimum bid gap'+selectedGap+'bp')}${stat('Baseline win rate',compareValues(full.winPct==null?'—':full.winPct.toFixed(1)+'%',central.winPct==null?'—':central.winPct.toFixed(1)+'%'),'1:20 leverage /20% loss target')}${stat('Baseline total return',compareValues(pct(full.returnPct),pct(central.returnPct)),'Same instrument and dates')}${stat('Baseline portfolio DD',compareValues(full.maxDrawdownPct.toFixed(1)+'%',central.maxDrawdownPct.toFixed(1)+'%'),'Full→central')}</div><p class="muted">Day labels before calendar/night gates: ${change.same??0} same-direction,${change.fullOnly??0} full-only,${change.centralOnly??0} central-only,${change.opposite??0} opposite,${change.neither??0} neither. This counts comparable observed NY sessions,not independent trades.</p>${checkNote}<p class="matrix-key">Columns: per-trade loss targets. Profit rows: target or 08:27. Cells: win% (wins/N) · return · portfolio DD /worst trade · TP/loss/deadline/rejected counts.</p><div class="research-policies">${inst.spec.policies.map(p=>policyView(inst,p)).join('')}</div>${ledger(inst,'full')}${ledger(inst,'central')}`}
function instrumentView(inst){return `<section id="${inst.epic}">${instrumentInner(inst)}</section>`}
function eventsPanel(){const c=D.events,policies=c.events.filter(e=>e.policyGuard),headlines=c.events.filter(e=>!e.policyGuard);return `<section id="events" class="data-section"><h2>Rare major-day context</h2><div class="stats">${stat('Flagged NY sessions',c.taggedSessionCount+'/'+c.sessionCount,(c.taggedSessionShare*100).toFixed(1)+'% of observed sessions')}${stat('Headline episodes',headlines.length,'Tariffs,election,war,exceptional market shocks')}${stat('Policy decision dates',policies.length,'FOMC/BOJ guards already exclude entries')}${stat('Calendar checked',c.checkedAt,'Curated historical list,not a live news feed')}</div><p class="research-note">Routine CPI/jobs/earnings/speeches and daily tariff commentary are omitted. Unlisted means no event on this curated list,not proof of a quiet day. Date-only/retrospective labels do not assert the news was known at entry. Event context never selects,resizes or suppresses these research trades.</p><div class="scroll"><table><thead><tr><th>NY session / exclusion date</th><th>Event</th><th>Timing / rule</th><th>Sources</th></tr></thead><tbody>${c.events.map(e=>`<tr><td>${e.sessionDate}${e.date!==e.sessionDate?`<br><small>Event${e.date}</small>`:''}</td><td>${esc(e.label)}</td><td class="event-cell">${esc(e.timing)}</td><td>${e.sources.map((s,i)=>`<a href="${esc(s.url)}" title="${esc(s.title)}">${i+1}</a>`).join(' · ')}</td></tr>`).join('')}</tbody></table></div></section>`}
function plots(){
 for(const inst of D.instruments)for(const p of inst.spec.policies){
  const allSeries=PROFITS.flatMap(t=>D.gapThresholds.flatMap(g=>['full','central'].map(w=>study(inst,w,g,t).curves[p.id+'/L20S20']))),base=D.benchmarks[inst.epic].equity,from=Date.UTC(2024,0,1),to=Date.UTC(2026,9,1),lo=Math.min(-5,...allSeries.flatMap(v=>v.map(p=>p[1]/100-100))),hi=Math.max(10,...base.map(p=>p[1]/100-100),...allSeries.flatMap(v=>v.map(p=>p[1]/100-100)));
  for(const profit of PROFITS)for(const gap of D.gapThresholds){
   const host=$('curve-'+inst.epic+'-'+p.id+'-'+gap+'-'+profit);if(!host)continue;const w=Math.max(300,host.clientWidth);host.replaceChildren();const svg=node('svg',{width:'100%',height:165,viewBox:`0 0 ${w} 165`},host),x=t=>39+(t-from)/(to-from)*(w-45),y=v=>140-(v-lo)/(hi-lo+1)*120;
   for(let i=0;i<3;i++){const v=lo+(hi-lo)*i/2;node('line',{x1:39,x2:w-5,y1:y(v),y2:y(v),stroke:color('border')},svg);label(svg,34,y(v)+3,v.toFixed(0)+'%',{'text-anchor':'end'})}
   ['full','central'].forEach((window,i)=>{const v=study(inst,window,gap,profit).curves[p.id+'/L20S20'];path(svg,[[x(from),y(0)],...v.map(p=>[x(p[0]),y(p[1]/100-100)])],{stroke:color('chart-'+(i+1)),'stroke-width':1.6,'data-session-window':window,'data-profit-target':profit})});
   path(svg,base.map(p=>[x(p[0]),y(p[1]/100-100)]),{stroke:color('muted-foreground'),'stroke-dasharray':'4 3','stroke-width':1.2,'data-hold-epic':inst.epic});
   for(const[t,z]of [[from,'2024'],[Date.UTC(2025,0,1),'2025'],[Date.UTC(2026,0,1),'2026']])label(svg,x(t),159,z);
  }
 }
 for(const svg of document.querySelectorAll('.spark')){
  svg.replaceChildren();const inst=D.instruments.find(i=>i.epic===svg.dataset.epic),t=study(inst,svg.dataset.window).trades.find(t=>t.id===+svg.dataset.trade),points=t.checkpoints,selected=t.recognitionPoints,values=points.map(p=>p[1]),lo=Math.min(0,...values),hi=Math.max(0,...values),from=points[0][0],through=points.at(-1)[0],x=v=>3+(v-from)/(through-from||1)*119,y=v=>36-(v-lo)/(hi-lo||1)*32;
  svg.setAttribute('viewBox','0 0 125 40');node('line',{x1:0,x2:125,y1:y(0),y2:y(0),stroke:color('border')},svg);
  if(t.sessionWindow==='central'){node('rect',{x:0,y:0,width:Math.max(0,x(t.recognitionFrom)),height:40,fill:color('secondary')},svg);node('rect',{x:x(t.recognitionThrough),y:0,width:Math.max(0,125-x(t.recognitionThrough)),height:40,fill:color('secondary')},svg);path(svg,points.map(p=>[x(p[0]),y(p[1])]),{stroke:color('muted-foreground'),'stroke-width':1,opacity:.5})}
  path(svg,selected.map(p=>[x(p[0]),y(p[1])]),{stroke:color(t.side==='long'?'chart-1':'chart-2'),'stroke-width':1.4});
 }
}

function cohort(){return `<h2 id="cohort">20 forward experiments · original + session/gap cohort</h2><p id="liveStatus" class="live-label"></p><div class="scroll"><table class="cohort"><thead><tr><th>Agent</th><th>Instrument</th><th>NY recognition</th><th>Day filter</th><th>Minimum gap</th><th>Leverage</th><th>Loss target</th><th>Profit target</th><th>BT N / year</th><th>BT win</th><th>BT return</th><th>Quote-path return range</th><th>vs own-index hold</th><th>BT max DD</th><th>Forward since</th><th>Virtual return</th><th>Virtual N</th><th>Capital cash return</th><th>Capital N</th><th>Demo assignment</th></tr></thead><tbody>${D.cohort.sort((a,b)=>(a.epic==='US500'?0:1)-(b.epic==='US500'?0:1)||a.leverage-b.leverage).map(r=>`<tr data-agent="${esc(r.id)}"><td><a href="/agents/${r.id}">${esc(r.id==='visar-night-trading'?'Original US500 · unchanged':r.id.split('/').at(-1))}</a></td><td>${r.epic}</td><td>${r.sessionWindow==='central'?'10:30–15:30':'09:30–16:00'}</td><td>${esc(D.instruments.find(i=>i.epic===r.epic)?.spec.policies.find(p=>p.id===r.policy)?.label??'Current day definition')}</td><td>${r.minimumGapBp?'≥'+r.minimumGapBp+' bp':'Any &gt;0'}</td><td>1:${r.leverage}</td><td>−${r.lossPct}%</td><td>${r.profitPct?'+'+r.profitPct+'% or 08:27 · '+r.targetHits+' TP':'08:27 only'}</td><td>${r.metrics.trades} / ${(r.metrics.trades/D.years).toFixed(1)}</td><td>${(r.metrics.winRate*100).toFixed(1)}%</td><td class="${tone(r.metrics.totalReturn)}">${pct(r.metrics.totalReturn*100)}</td><td>${r.pathRange?`${pct(r.pathRange.minReturnPct)} to ${pct(r.pathRange.maxReturnPct)}<br><small>${r.pathRange.paths} paths · worst DD ${r.pathRange.maxDrawdownPct.toFixed(1)}%</small>`:'Original reference'}</td><td class="${tone(r.benchmarkExcessPp)}">${f(r.benchmarkExcessPp)} pp</td><td>${(r.metrics.maxDrawdown*100).toFixed(1)}%</td><td data-live="since">—</td><td data-live="return">—</td><td data-live="n">—</td><td data-live="capitalReturn">—</td><td data-live="capitalN">—</td><td data-live="capital">—</td></tr>`).join('')}</tbody></table></div><p class="research-note">Correlated experiments selected on inspected history. Forward records begin separately; original US500 history is retained. A positive backtest is not validation.</p>`}
function stockSection(){let s=D.stocks;return `<section id="stocks" class="data-section"><h2>Nasdaq-100 stock purchase budget</h2><p class="muted">QQQ equity holdings proxy · ${s.rows.length} securities · ${s.holdingsAsOf} holdings/valuation · broker rules fetched ${date(s.at)}</p><div class="stats">${stat('One whole share of each',money(s.wholeShareBasket),'Assumes 1-share minimum; not index weights')}${stat('Index-weighted whole-share floor',money(s.wholeShareWeightedFloor),s.bindingTicker+' sets the minimum scale')}${stat('Rounded-up weighted basket',money(s.wholeShareRoundedCash),'One-share increments, target-weight rounding')}${stat('Known Capital CFD minimums','≥ '+money(s.partialCFDFloor),s.matched+'/101 USD matches; incomplete lower bound')}</div><p class="research-note">Whole-share scenarios use fund-implied USD prices and assume one-share minimums; actual cash-broker fractional limits are unknown. Capital quantities are CFD contracts, not share ownership. Missing/unmatched Nasdaq listings: ${s.missing.join(', ')}. No complete broker basket minimum is claimed. Hold benchmarks use the corresponding index price as a proxy; historical constituent changes, dividends and direct-stock rebalance costs are not reconstructed.</p><div class="scroll"><table class="stock-table"><thead><tr><th>Ticker</th><th>Index-proxy weight</th><th>USD share value</th><th>Capital min units</th><th>Known USD notional</th><th>Match</th></tr></thead><tbody>${s.rows.map(r=>`<tr><td>${esc(r.ticker)}</td><td>${(r.normalizedWeight*100).toFixed(3)}%</td><td>${money(r.holdingsPrice)}</td><td>${r.usdMatched?r.minDealSize:'—'}</td><td>${r.usdMatched?money(r.minimumNotional):'—'}</td><td>${r.usdMatched?'USD · lot 1':r.currency&&r.currency!=='USD'?esc(r.currency)+' listing':'Unverified'}</td></tr>`).join('')}</tbody></table></div><p class="research-note">Sources: <a href="${esc(s.source)}">Invesco daily holdings</a> · Capital demo market metadata (no account changes/orders). Equity weights are normalized after excluding fund cash/futures. The holdings proxy is a current purchase-budget snapshot, not a survivorship-biased historical stock backtest.</p></section>`}
let html=`<h2>Matched 1:1 hold benchmarks</h2><div class="policies">${['US500','US100'].map(epic=>{const b=D.benchmarks[epic];return `<article><h3>${epic} 1:1 hold</h3><div class="stats">${stat('Return',pct(b.returnPct),'100% cash exposure',tone(b.returnPct))}${stat('Final value',money(b.finalEquity),'From $10,000 over the study window')}${stat('Drawdown',b.maxDrawdownPct.toFixed(1)+'%','Minute-close equity drawdown')}${stat('Overnight funding',money(b.funding),'No financing in the hold proxy')}</div></article>`}).join('')}</div><p class="research-note">US500 strategies compare with US500 hold; US100 strategies compare with US100 hold. Δ is strategy total return minus its own index’s 1:1 hold return in percentage points over identical historical dates. The win rate needed to offset trading losses remains a separate payoff calculation. Both hold proxies include an opening ask/closing bid spread and no financing; dividends, taxes and direct-stock rebalance costs are not reconstructed.</p>`+studyControls()+exitFocus()+studyOverview()+cohort()+`<h2>Full-session reference rules and trade clocks</h2><div class="scroll"><table><thead><tr><th>Move</th><th>Efficiency</th><th>Agreeing steps</th><th>Adverse reversal</th><th>Body/range</th><th>Range/open</th><th>Coverage</th></tr></thead><tbody><tr><td>≥0.25%</td><td>≥15%</td><td>≥13/26</td><td>≤75%</td><td>≥60%</td><td>≤2%</td><td>≥351/390 min</td></tr></tbody></table></div><p class="research-note">Every policy changes only its named day filter. Bullish and bearish are symmetric. FOMC/BOJ exclusion dates, one attempt/night, 22:00 reference, 03:27 entry and 08:27 deadline remain fixed. Loss and profit limits are % of that trade’s starting equity; all loss limits are ≤50%. Every profit target retains the 08:27 deadline.</p>`;
for(const inst of D.instruments)html+=instrumentView(inst);html+=eventsPanel();
html+=stockSection()+`<hr class="divider"><p class="research-note">Generated ${esc(D.generatedAt)}. All 20,736 settings use the same historical window; they are not independent tests. Session and gap dimensions were added after inspecting history. Win-rate intervals assume independent, stable trials. Actual loss can exceed the configured ordinary-stop target; Capital pooled-margin closeout is separate. Portfolio DD uses all generated ticks; hold DD uses minute closes. Historic fills, especially tight stops, are approximations from minute OHLC. Recorded live inputs are not fabricated.</p><p><a href="./trades.csv">US500 71-trade CSV</a> · <a href="./risk-grid.csv">US500 324-cell CSV</a> · <a href="./us100-risk-grid.csv">US100 324-cell CSV</a> · <a href="./us500-gap-risk-grid.csv">US500 session/gap CSV</a> · <a href="./us100-gap-risk-grid.csv">US100 session/gap CSV</a> · <a href="./us500-exit-risk-grid.csv">US500 all exit settings CSV</a> · <a href="./us100-exit-risk-grid.csv">US100 all exit settings CSV</a> · <a href="./report.json">All derived report data</a></p>`;
$('content').innerHTML=html;

function node(tag,attrs,parent){let e=document.createElementNS(N,tag);for(let[k,v]of Object.entries(attrs))e.setAttribute(k,v);parent.append(e);return e}
