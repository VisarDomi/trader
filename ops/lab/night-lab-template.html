</style></head><body><main>
<header><h1>Visar Night Lab</h1><nav><a href="/?q=visar">Trader · all 20</a> · <a href="#US500">US500</a> · <a href="#US100">US100</a> · <a href="#stocks">Stock budget</a></nav></header>

(async()=>{

function cell(r){return `<div class="cell"><b>${r.winPct==null?'—':r.winPct.toFixed(1)+'%'}</b><small>${r.wins}/${r.n} wins</small><small>${r.winInterval?`CI ${r.winInterval[0].toFixed(0)}–${r.winInterval[1].toFixed(0)}%`:"CI —"}</small><span class="${tone(r.returnPct)}">${pct(r.returnPct)}</span><span class="${tone(r.nasdaqExcessPp)}">Δ ${f(r.nasdaqExcessPp)} pp</span><span>DD ${r.maxDrawdownPct.toFixed(1)}%</span><span class="${tone(r.worstTradePct)}">Loss ${pct(r.worstTradePct)}</span><small>${r.stops} stops · ${r.rejected} rejected</small></div>`}

function yearsTable(inst,p){return `<table><thead><tr><th>Tier / loss</th><th>2024</th><th>2025</th><th>2026 Jan–Sep</th></tr></thead><tbody>${['L1S50','L20S20','L100S10'].map(k=>{let r=inst.runs.find(r=>r.policy===p.id&&r.profile===k);return `<tr><td>1:${r.leverage} /${r.lossPct}%</td>${['2024','2025','2026'].map(y=>{let v=r.years[y];return `<td><span class="${tone(v.returnPct)}">${v.n?pct(v.returnPct):'—'}</span><br><small>${v.wins}/${v.n} wins</small></td>`}).join('')}</tr>`}).join('')}</tbody></table>`}
function matrix(inst,p){let rs=inst.runs.filter(r=>r.policy===p.id),wide=rs.find(r=>r.profile==='L1S50');return `<article class="policy"><h3>${esc(p.label)}</h3><p class="muted">${wide.n} fills · ${wide.tradesPerYear.toFixed(1)}/year · ${wide.eligible} eligible nights</p><div id="curve-${inst.epic}-${p.id}" class="plot" aria-label="Equity comparison"></div><div class="legend"><span><i class="key" style="background:var(--chart-1)"></i>1:1 /50% loss</span><span><i class="key" style="background:var(--chart-2)"></i>1:20 /20%</span><span><i class="key" style="background:var(--chart-3)"></i>1:100 /10%</span><span>Dashed: Nasdaq cash-hold proxy</span></div><p class="muted">Win% · wins/N · return% · Δ pp vs Nasdaq · portfolio DD% · worst trade% · stops/rejections</p><table class="matrix"><thead><tr><th>Lev.</th>${inst.spec.stops.map(x=>`<th>−${x}%</th>`).join('')}</tr></thead><tbody>${inst.spec.leverageTiers.map(l=>`<tr><th>1:${l}</th>${inst.spec.stops.map(s=>`<td>${cell(rs.find(r=>r.leverage===l&&r.lossPct===s))}</td>`).join('')}</tr>`).join('')}</tbody></table>${yearsTable(inst,p)}</article>`}
function ledger(epic){return `<section class="data-section"><h3>${epic} · original-rule trades and preceding NY sessions</h3><div class="scroll"><table class="ledger"><thead><tr><th>Entry · Albania</th><th>Side</th><th>Previous NY path</th><th>Return</th><th>Open → close</th><th>Close · reason</th><th>Spread drag</th><th>Funding</th><th>Units</th><th>Entry capital</th><th>Day move</th><th>Efficiency</th><th>Agree</th><th>Reversal</th><th>Body/range</th><th>Night pullback</th></tr></thead><tbody>${D.trades[epic].map(t=>`<tr><td>${t.date}<br><small>03:27 · prior ${t.session}</small></td><td>${t.side}<br><small>${t.side==='long'?'Bullish + dip':'Bearish + bounce'}</small></td><td><svg class="spark" data-epic="${epic}" data-trade="${t.id}"></svg></td><td class="${tone(t.returnPct)}">${pct(t.returnPct)}</td><td>${t.entryPrice.toFixed(1)} → ${t.exitPrice.toFixed(1)}</td><td>${time(t.exitTime)} · ${t.stop?'loss stop':'deadline'}</td><td>${t.spreadCostPct.toFixed(2)}%</td><td>${money(t.funding)}</td><td>${t.size.toFixed(2)}</td><td>${money(t.entryEquity)}</td><td>${t.movePct.toFixed(2)}%</td><td>${(t.efficiency*100).toFixed(1)}%</td><td>${t.agreementSteps}/26</td><td>${(t.retracement*100).toFixed(1)}%</td><td>${(t.body*100).toFixed(1)}%</td><td>${t.pullbackBp.toFixed(1)} bp</td></tr>`).join('')}</tbody></table></div></section>`}
function cohort(){return `<h2 id="cohort">20 forward experiments</h2><p id="liveStatus" class="live-label"></p><div class="scroll"><table class="cohort"><thead><tr><th>Agent</th><th>Instrument</th><th>Leverage</th><th>Loss target</th><th>BT N / year</th><th>BT win</th><th>BT return</th><th>vs Nasdaq</th><th>BT max DD</th><th>Forward since</th><th>Virtual return</th><th>Virtual N</th><th>Capital cash return</th><th>Capital N</th><th>Demo assignment</th></tr></thead><tbody>${D.cohort.sort((a,b)=>(a.epic==='US500'?0:1)-(b.epic==='US500'?0:1)||a.leverage-b.leverage).map(r=>`<tr data-agent="${esc(r.id)}"><td><a href="/agents/${r.id}">${esc(r.id==='visar-night-trading'?'Original US500 · unchanged':r.id.split('/').at(-1))}</a></td><td>${r.epic}</td><td>1:${r.leverage}</td><td>−${r.lossPct}%</td><td>${r.metrics.trades} / ${(r.metrics.trades/D.years).toFixed(1)}</td><td>${(r.metrics.winRate*100).toFixed(1)}%</td><td class="${tone(r.metrics.totalReturn)}">${pct(r.metrics.totalReturn*100)}</td><td class="${tone(r.nasdaqExcessPp)}">${f(r.nasdaqExcessPp)} pp</td><td>${(r.metrics.maxDrawdown*100).toFixed(1)}%</td><td data-live="since">—</td><td data-live="return">—</td><td data-live="n">—</td><td data-live="capitalReturn">—</td><td data-live="capitalN">—</td><td data-live="capital">—</td></tr>`).join('')}</tbody></table></div><p class="research-note">Correlated experiments selected on inspected history. Forward records begin separately; original US500 history is retained. A positive backtest is not validation.</p>`}
function stockSection(){let s=D.stocks;return `<section id="stocks" class="data-section"><h2>Nasdaq-100 stock purchase budget</h2><p class="muted">QQQ equity holdings proxy · ${s.rows.length} securities · ${s.holdingsAsOf} holdings/valuation · broker rules fetched ${date(s.at)}</p><div class="stats">${stat('One whole share of each',money(s.wholeShareBasket),'Assumes 1-share minimum; not index weights')}${stat('Index-weighted whole-share floor',money(s.wholeShareWeightedFloor),s.bindingTicker+' sets the minimum scale')}${stat('Rounded-up weighted basket',money(s.wholeShareRoundedCash),'One-share increments, target-weight rounding')}${stat('Known Capital CFD minimums','≥ '+money(s.partialCFDFloor),s.matched+'/101 USD matches; incomplete lower bound')}</div><p class="research-note">Whole-share scenarios use fund-implied USD prices and assume one-share minimums; actual cash-broker fractional limits are unknown. Capital quantities are CFD contracts, not share ownership. Missing/unmatched Nasdaq listings: ${s.missing.join(', ')}. No complete broker basket minimum is claimed. The benchmark below uses the index price as a proxy; historical constituent changes, dividends and direct-stock rebalance costs are not reconstructed.</p><div class="scroll"><table class="stock-table"><thead><tr><th>Ticker</th><th>Index-proxy weight</th><th>USD share value</th><th>Capital min units</th><th>Known USD notional</th><th>Match</th></tr></thead><tbody>${s.rows.map(r=>`<tr><td>${esc(r.ticker)}</td><td>${(r.normalizedWeight*100).toFixed(3)}%</td><td>${money(r.holdingsPrice)}</td><td>${r.usdMatched?r.minDealSize:'—'}</td><td>${r.usdMatched?money(r.minimumNotional):'—'}</td><td>${r.usdMatched?'USD · lot 1':r.currency&&r.currency!=='USD'?esc(r.currency)+' listing':'Unverified'}</td></tr>`).join('')}</tbody></table></div><p class="research-note">Sources: <a href="${esc(s.source)}">Invesco daily holdings</a> · Capital demo market metadata (no account changes/orders). Equity weights are normalized after excluding fund cash/futures. The holdings proxy is a current purchase-budget snapshot, not a survivorship-biased historical stock backtest.</p></section>`}
let html=`<h2>Cash-stock opportunity cost</h2><div class="stats">${stat('Nasdaq-100 1:1 hold',pct(bench.returnPct),'100% cash exposure · zero overnight funding',tone(bench.returnPct))}${stat('Nasdaq final value',money(bench.finalEquity),'From $10,000 over the same study window')}${stat('Nasdaq drawdown',bench.maxDrawdownPct.toFixed(1)+'%','Minute-close equity drawdown')}${stat('US500 1:1 hold',pct(D.benchmarks.US500.returnPct),'Same-instrument price comparison',tone(D.benchmarks.US500.returnPct))}</div><p class="research-note">Δ is strategy total return minus Nasdaq cash-hold return in percentage points over identical historical dates. This is the opportunity-cost target; the win rate needed to offset trading losses is a separate payoff calculation. Proxy includes an opening ask/closing bid spread and no financing; it excludes dividends, taxes and unobserved constituent rebalance costs.</p>`+cohort()+`<h2>Original day rules and trade clocks</h2><div class="scroll"><table><thead><tr><th>Move</th><th>Efficiency</th><th>Agreeing steps</th><th>Adverse reversal</th><th>Body/range</th><th>Range/open</th><th>Coverage</th></tr></thead><tbody><tr><td>≥0.25%</td><td>≥15%</td><td>≥13/26</td><td>≤75%</td><td>≥60%</td><td>≤2%</td><td>≥351/390 min</td></tr></tbody></table></div><p class="research-note">Every policy changes only its named day filter. Bullish and bearish are symmetric. FOMC/BOJ exclusion dates, one attempt/night, 22:00 reference, 03:27 entry and 08:27 deadline remain fixed. Cell loss limits are % of that trade’s starting equity; all are ≤50%.</p>`;
for(let inst of D.instruments){html+=`<section id="${inst.epic}"><h2>${inst.epic} · ${inst.epic==='US500'?'original instrument':'Nasdaq-100 research'}</h2><p class="muted">09:30–16:00 New York day → 22:00 Albania reference → 03:27 entry against the overnight pullback → 08:27 exit or loss stop. 90% margin in every risk cell.</p><div class="scroll"><table class="definition"><thead><tr><th>Day definition</th><th>N</th><th>Trades/year</th><th>Low-exposure win</th><th>1:20 /20% return</th><th>vs Nasdaq</th><th>1:20 max DD</th><th>1:20 mean win/loss</th><th>Payoff break-even win rate</th></tr></thead><tbody>${inst.spec.policies.map(p=>{let low=inst.runs.find(r=>r.policy===p.id&&r.profile==='L1S50'),r=inst.runs.find(r=>r.policy===p.id&&r.profile==='L20S20');return `<tr><td>${esc(p.label)}</td><td>${low.n}</td><td>${low.tradesPerYear.toFixed(1)}</td><td>${low.winPct==null?'—':low.winPct.toFixed(1)+'%'}</td><td class="${tone(r.returnPct)}">${pct(r.returnPct)}</td><td class="${tone(r.nasdaqExcessPp)}">${f(r.nasdaqExcessPp)} pp</td><td>${r.maxDrawdownPct.toFixed(1)}%</td><td>${pct(r.avgWinPct)} / ${pct(r.avgLossPct)}</td><td>${r.breakEvenWinPct==null?'—':r.breakEvenWinPct.toFixed(1)+'%'}</td></tr>`}).join('')}</tbody></table></div><div class="policies">${inst.spec.policies.map(p=>matrix(inst,p)).join('')}</div>${ledger(inst.epic)}</section>`}
html+=stockSection()+`<hr class="divider"><p class="research-note">Generated ${esc(D.generatedAt)}. All 648 risk cells use the same historical window; they are not 648 independent tests. Win-rate intervals assume independent, stable trials. Actual loss can exceed the configured ordinary-stop target; Capital pooled-margin closeout is separate. Portfolio DD uses all generated ticks; hold DD uses minute closes. Historic fills, especially tight stops, are approximations from minute OHLC. Recorded live inputs are not fabricated.</p><p><a href="./trades.csv">US500 71-trade CSV</a> · <a href="./risk-grid.csv">US500 324-cell CSV</a> · <a href="./us100-risk-grid.csv">US100 324-cell CSV</a> · <a href="./report.json">All derived report data</a></p>`;
$('content').innerHTML=html;
const cohortLabels=[...document.querySelectorAll('.cohort th')].map(x=>x.textContent);for(const tr of document.querySelectorAll('.cohort tbody tr'))for(const [i,td]of [...tr.children].entries())td.setAttribute('data-label',cohortLabels[i]);
function node(tag,attrs,parent){let e=document.createElementNS(N,tag);for(let[k,v]of Object.entries(attrs))e.setAttribute(k,v);parent.append(e);return e}
function color(k){return getComputedStyle(document.documentElement).getPropertyValue('--'+k).trim()}
function path(svg,points,attrs){return node('path',{d:points.map((p,i)=>(i?'L':'M')+p.join(',')).join(' '),fill:'none',...attrs},svg)}
function label(svg,x,y,value,attrs={}){let t=node('text',{x,y,fill:color('muted-foreground'),'font-size':9,...attrs},svg);t.textContent=value}
function plots(){for(let inst of D.instruments)for(let p of inst.spec.policies){let host=$('curve-'+inst.epic+'-'+p.id),w=Math.max(300,host.clientWidth);host.replaceChildren();let s=node('svg',{width:'100%',height:165,viewBox:`0 0 ${w} 165`},host),series=['L1S50','L20S20','L100S10'].map(k=>inst.curves[p.id+'/'+k]),base=bench.equity,from=Date.UTC(2024,0,1),to=Date.UTC(2026,9,1),lo=Math.min(-5,...series.flatMap(v=>v.map(p=>p[1]/100-100))),hi=Math.max(10,...base.map(p=>p[1]/100-100),...series.flatMap(v=>v.map(p=>p[1]/100-100))),x=t=>39+(t-from)/(to-from)*(w-45),y=v=>140-(v-lo)/(hi-lo+1)*120;for(let i=0;i<3;i++){let v=lo+(hi-lo)*i/2;node('line',{x1:39,x2:w-5,y1:y(v),y2:y(v),stroke:color('border')},s);label(s,34,y(v)+3,v.toFixed(0)+'%',{'text-anchor':'end'})}for(let [i,v]of series.entries())path(s,[[x(from),y(0)],...v.map(p=>[x(p[0]),y(p[1]/100-100)])],{stroke:color('chart-'+(i+1)),'stroke-width':1.5});path(s,base.map(p=>[x(p[0]),y(p[1]/100-100)]),{stroke:color('muted-foreground'),'stroke-dasharray':'4 3','stroke-width':1.2});for(let[t,z]of [[from,'2024'],[Date.UTC(2025,0,1),'2025'],[Date.UTC(2026,0,1),'2026']])label(s,x(t),159,z);}
for(let svg of document.querySelectorAll('.spark')){svg.replaceChildren();let t=D.trades[svg.dataset.epic].find(t=>t.id===+svg.dataset.trade),v=t.checkpoints.map(p=>p[1]),lo=Math.min(0,...v),hi=Math.max(0,...v),x=i=>3+i/(v.length-1)*119,y=n=>36-(n-lo)/(hi-lo||1)*32;svg.setAttribute('viewBox','0 0 125 40');node('line',{x1:0,x2:125,y1:y(0),y2:y(0),stroke:color('border')},svg);path(svg,v.map((n,i)=>[x(i),y(n)]),{stroke:color(t.side==='long'?'chart-1':'chart-2'),'stroke-width':1.3})}}
plots();let timer;new ResizeObserver(()=>{clearTimeout(timer);timer=setTimeout(plots,100)}).observe(document.body);
let forwardBusy=false;
async function forward(){if(forwardBusy)return;forwardBusy=true;try{let r=await fetch('./forward.json',{cache:'no-store',signal:AbortSignal.timeout(12000)});if(!r.ok||!r.headers.get('content-type')?.includes('application/json'))throw Error('Unavailable');let d=await r.json();$('liveStatus').textContent=(d.offline?'Offline · saved ':'Updated ')+new Date(d.at).toLocaleString();for(let row of document.querySelectorAll('[data-agent]')){let v=d.rows.find(v=>v.agentId===row.dataset.agent);if(!v)continue;row.querySelector('[data-live=since]').textContent=date(v.startedAt);let cell=row.querySelector('[data-live=return]');cell.textContent=v.totalReturn==null?'—':pct(v.totalReturn*100);cell.className=tone(v.totalReturn);row.querySelector('[data-live=n]').textContent=v.trades;row.querySelector('[data-live=capital]').textContent=v.status==='retired'?'Archived':v.mirrored?'Assigned':'Awaiting slot';const actual=row.querySelector('[data-live=capitalReturn]');actual.textContent=v.capitalReturn==null?'—':pct(v.capitalReturn*100);actual.className=tone(v.capitalReturn);row.querySelector('[data-live=capitalN]').textContent=v.capitalTrades??'—'}}catch{$('liveStatus').textContent='Forward data unavailable · historical study retained'}finally{forwardBusy=false}}
if(location.protocol.startsWith('http')&&location.pathname.startsWith('/night-lab/')){forward();setInterval(()=>{if(!document.hidden)forward()},30000);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{})}else $('liveStatus').textContent='Historical snapshot · live cohort at Trader';
window.nightLab={data:D,plots};
})().catch(e=>{document.getElementById('error').hidden=false;document.getElementById('error').textContent='Report could not load: '+e.message});
